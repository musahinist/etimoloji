name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check engine/ scripts/

      - name: Testler ve kapsam
        # Testler ağsız çalışır: conftest.py soket düzeyinde canlı ağı engeller.
        # Canlı kaynak testleri (engine/tests/live) ETY_LIVE=1 olmadan atlanır.
        run: pytest --cov=engine --cov-report=term-missing --cov-fail-under=90

  test-with-phonology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonoloji kütüphaneleriyle kur (lingpy, panphon, epitran)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,phon,pdf]"
      - name: Testler
        run: pytest -q
